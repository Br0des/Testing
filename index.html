<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brodes</title>
<style>
  :root {
    --bg: #0B1B3A;
    --ink: #F3F5F9;
    --ink-soft: #A9B7D1;
    --ink-faint: #6B7A96;
    --accent: #E3B873;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(160deg, #0B1B3A 0%, #1B3B6E 50%, #2C5A94 100%);
    background-size: 150% 150%;
    animation: drift 20s ease-in-out infinite alternate;
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  @keyframes drift {
    0% { background-position: 0% 0%; }
    100% { background-position: 100% 100%; }
  }

  /* --- OPENING ANIMATION --- */
  .profile > * {
    opacity: 0;
    transform: translateY(18px);
    filter: blur(6px);
    animation: riseIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .eyebrow { animation-delay: 0.05s; }
  h1 { animation-delay: 0.15s; }
  .tagline { animation-delay: 0.25s; }
  .links { animation-delay: 0.35s; }

  @keyframes riseIn {
    to {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  /* --- LINKS STAGGER IN ONE BY ONE --- */
  .links a {
    opacity: 0;
    transform: translateY(10px) scale(0.9);
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .links a:nth-child(1) { animation-delay: 0.45s; }
  .links a:nth-child(2) { animation-delay: 0.53s; }
  .links a:nth-child(3) { animation-delay: 0.61s; }
  .links a:nth-child(4) { animation-delay: 0.69s; }
  .links a:nth-child(5) { animation-delay: 0.77s; }

  @keyframes popIn {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
    .profile > *, .links a, .disclaimer { animation: none; opacity: 1; transform: none; filter: none; }
  }

  .profile {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  h1 {
    font-weight: 800;
    font-size: clamp(36px, 6vw, 52px);
    letter-spacing: -0.015em;
    margin-bottom: 8px;
  }

  .tagline {
    font-size: 16px;
    color: var(--ink-soft);
    margin-bottom: 36px;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }

  /* --- HOVER ANIMATIONS --- */
  .links a {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    text-decoration: none;
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    transition:
      transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.25s ease,
      color 0.2s ease,
      border-color 0.2s ease,
      background 0.2s ease;
  }

  .links a:hover {
    color: var(--ink);
    border-color: var(--accent);
    background: rgba(227, 184, 115, 0.12);
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 10px 24px -8px rgba(227, 184, 115, 0.4);
  }

  .links a:active {
    transform: translateY(-1px) scale(0.97);
    box-shadow: 0 4px 12px -6px rgba(227, 184, 115, 0.3);
  }

  /* --- DISCLAIMER --- */
  .disclaimer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 14px 16px;
    text-align: center;
    font-size: 11px;
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    pointer-events: none;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.2s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="profile">
    <div class="eyebrow">Hello, I'm</div>
    <h1>Brodes</h1>
    <div class="tagline">Tech Nerd</div>

    <div class="links">
      <a href="https://github.com/Br0des" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.youtube.com/@BR0DES-1" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="https://www.tiktok.com/@brodesvr" target="_blank" rel="noopener noreferrer">TikTok</a>
      <a href="https://mail.brodes.net" target="_blank" rel="noopener noreferrer">Mail</a>
      <a href="games.html">Games</a>
    </div>
  </div>

  <footer class="disclaimer">This website was created with the help of AI.</footer>
</body>
</html>
