<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brodes - Arcade</title>
<style>
  :root {
    --bg-1: #0B1B3A; --bg-2: #1B3B6E; --bg-3: #2C5A94;
    --panel: rgba(255, 255, 255, 0.07); --ink: #F3F5F9; --ink-soft: #A9B7D1;
    --accent: #E3B873; --border: rgba(255, 255, 255, 0.2);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg-1); color: var(--ink); font-family: var(--font-sans); min-height: 100vh; padding: 56px 24px; position: relative; overflow-x: hidden; }

  /* Twirling Blobs */
  .blob { position: fixed; z-index: -1; width: 120vmax; height: 120vmax; top: -30vmax; left: -30vmax; filter: blur(80px); pointer-events: none; opacity: 0.85; }
  .blob-1 { background: radial-gradient(circle at 30% 40%, rgba(150, 190, 255, 0.5), transparent 50%), radial-gradient(circle at 70% 60%, rgba(44, 90, 148, 0.8), transparent 50%); animation: twirlRight 35s linear infinite, blobMorph1 20s ease-in-out infinite alternate; }
  .blob-2 { background: radial-gradient(circle at 60% 30%, rgba(227, 184, 115, 0.35), transparent 50%), radial-gradient(circle at 40% 80%, rgba(27, 59, 110, 0.9), transparent 50%); animation: twirlLeft 45s linear infinite, blobMorph2 25s ease-in-out infinite alternate; }
  @keyframes twirlRight { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  @keyframes twirlLeft { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
  @keyframes blobMorph1 { 0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; } 50% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; } 100% { border-radius: 50% 50% 40% 60% / 40% 60% 50% 50%; } }
  @keyframes blobMorph2 { 0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; } 50% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; } 100% { border-radius: 50% 50% 60% 40% / 60% 40% 60% 40%; } }

  .wrap { position: relative; z-index: 1; max-width: 1100px; width: 100%; margin: 0 auto; opacity: 0; transform: translateY(12px); animation: rise 0.7s ease forwards 0.1s; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .wrap { animation: none; opacity: 1; transform: none; } .blob { animation: none !important; border-radius: 50% !important; opacity: 0.5; } * { transition: none !important; } }

  .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .back-btn { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 500; color: var(--ink); text-decoration: none; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(30px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: 0 12px 30px -14px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.4); overflow: hidden; transition: background 0.3s, transform 0.2s; }
  .back-btn svg { width: 15px; height: 15px; }
  .back-btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateX(-3px); }
  .nav-logo { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }

  .header { margin-bottom: 40px; text-align: center; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  h1 { font-family: var(--font-sans); font-weight: 800; font-size: clamp(40px, 7vw, 64px); line-height: 1; letter-spacing: -0.015em; margin-bottom: 12px; }
  .bio { font-size: 15.5px; line-height: 1.7; color: var(--ink-soft); max-width: 50ch; margin: 0 auto; }

  .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
  .game-card { position: relative; border-radius: 16px; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 12px 30px -14px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.4); overflow: hidden; cursor: pointer; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .game-card:hover { transform: translateY(-5px); }
  .game-card::before { content: ""; position: absolute; inset: -50%; z-index: 0; background: radial-gradient(100px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.35), transparent 45%); opacity: 0; transition: opacity 0.4s; pointer-events: none; filter: blur(12px); }
  .game-card:hover::before { opacity: 1; }
  .game-thumb { width: 100%; height: 120px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); position: relative; overflow: hidden; }
  .game-thumb svg { width: 40px; height: 40px; z-index: 2; }
  .play-overlay { position: absolute; inset: 0; background: rgba(11,27,58,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; z-index: 3; }
  .game-card:hover .play-overlay { opacity: 1; }
  .play-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
  .play-icon::after { content: ''; border-left: 10px solid var(--bg-1); border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 3px; }
  .game-info { padding: 12px 14px; }
  .game-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .game-desc { font-size: 11px; color: var(--ink-soft); line-height: 1.4; height: 30px; overflow: hidden; }
  .game-tag { display: inline-block; margin-top: 8px; font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); background: rgba(227,184,115,0.1); padding: 3px 6px; border-radius: 4px; border: 1px solid rgba(227,184,115,0.2); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s; }
  .modal-overlay.active { display: flex; opacity: 1; }
  .modal-content { background: rgba(20,40,80,0.6); backdrop-filter: blur(40px) saturate(180%); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 30px 60px -15px rgba(0,0,0,0.6); border-radius: 16px; padding: 15px; width: 95%; max-width: 820px; position: relative; transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; flex-direction: column; max-height: 95vh; }
  .modal-overlay.active .modal-content { transform: scale(1); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 5px; }
  .modal-title { font-size: 18px; font-weight: 700; font-family: var(--font-mono); color: var(--accent); letter-spacing: 0.05em; }
  .close-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: var(--ink); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .close-btn:hover { background: rgba(255,100,100,0.4); }

  .game-container { display: flex; flex-direction: column; align-items: center; gap: 15px; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; min-height: 400px; overflow-y: auto; }
  .game-iframe { width: 100%; height: 60vh; border: none; border-radius: 8px; background: #000; }
  canvas { background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); touch-action: none; }
  button { font-family: var(--font-sans); cursor: pointer; transition: all 0.2s; }
  .btn { background: var(--accent); color: var(--bg-1); border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(227,184,115,0.4); }
  .btn-ghost { background: rgba(255,255,255,0.1); color: var(--ink); border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 8px; font-size: 13px; }
  .btn-ghost:hover { background: rgba(255,255,255,0.2); }
  
  .game-score { font-family: var(--font-mono); font-size: 14px; color: var(--accent); letter-spacing: 0.1em; margin-bottom: 10px; }
  .grid-board { display: grid; gap: 4px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 8px; }
  .cell { background: rgba(255,255,255,0.1); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--ink); cursor: pointer; transition: background 0.2s; }
  .cell:hover { background: rgba(255,255,255,0.2); }
  
  @media (max-width: 620px) {
    .top-nav { margin-bottom: 30px; }
    .games-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
    .game-thumb { height: 90px; }
    .game-thumb svg { width: 30px; height: 30px; }
    .modal-content { padding: 10px; }
    .game-iframe { height: 50vh; }
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="wrap">
    <div class="top-nav">
      <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Back to Profile
      </a>
      <div class="nav-logo">Brodes // Arcade</div>
    </div>
    <div class="header">
      <div class="eyebrow">Game On</div>
      <h1>The Arcade</h1>
      <p class="bio">25 classic games. A mix of embedded open-source classics and games I coded from scratch. Click any game to start playing instantly!</p>
    </div>
    <div class="games-grid" id="gamesGrid"></div>
  </div>

  <div class="modal-overlay" id="gameModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Game</div>
        <button class="close-btn" id="closeModal">✕</button>
      </div>
      <div class="game-container" id="gameContainer"></div>
    </div>
  </div>
 
  <script>
    const games = [
      // --- EMBEDDED OPEN SOURCE GAMES (via iframe) ---
      { title: "2048", desc: "Slide and merge tiles to reach 2048.", tag: "Embed", type: "iframe", src: "https://play2048.co/", bg: "linear-gradient(135deg, #faf8ef 0%, #bbada0 100%)", icon: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>', stroke: "#776e65" },
      { title: "Tetris", desc: "The classic block-stacking game.", tag: "Embed", type: "iframe", src: "https://chvin.github.io/react-tetris/", bg: "linear-gradient(135deg, #1a1a1a 0%, #4a4a4a 100%)", icon: '<rect x="3" y="3" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/>', stroke: "#f1c40f" },
      { title: "Pac-Man", desc: "Google's playable Pac-Man doodle.", tag: "Embed", type: "iframe", src: "https://www.google.com/logos/2010/pacman10-i.html", bg: "linear-gradient(135deg, #000000 0%, #1a1a1a 100%)", icon: '<path d="M12 2a10 10 0 1 0 10 10h-7l5-5z"/>', stroke: "#ffff00" },
      { title: "Flappy Bird", desc: "Tap to fly through pipes.", tag: "Embed", type: "iframe", src: "https://flappybird.io/", bg: "linear-gradient(135deg, #4ec0ca 0%, #ded895 100%)", icon: '<path d="M12 2C8 2 5 5 5 9v3l-3 2v3h3v3h4v-2h4v2h4v-2h2v-6c0-4-3-7-7-7z"/><circle cx="10" cy="10" r="1"/>', stroke: "#ffffff" },
      { title: "Asteroids", desc: "Shoot asteroids in deep space.", tag: "Embed", type: "iframe", src: "https://freeasteroids.org/", bg: "linear-gradient(135deg, #0b0033 0%, #4c0080 100%)", icon: '<polygon points="12 2 4 20 20 20"/>', stroke: "#ffffff" },
      { title: "Minesweeper", desc: "Clear the board without hitting bombs.", tag: "Embed", type: "iframe", src: "https://playminesweeperonline.com/", bg: "linear-gradient(135deg, #c0c0c0 0%, #808080 100%)", icon: '<circle cx="12" cy="12" r="6"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/>', stroke: "#ff0000" },
      { title: "Hextris", desc: "Fast-paced puzzle inspired by Tetris.", tag: "Embed", type: "iframe", src: "https://hextris.io/", bg: "linear-gradient(135deg, #2c3e50 0%, #3498db 100%)", icon: '<polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/>', stroke: "#ecf0f1" },
      { title: "ZType", desc: "Type words to destroy alien ships.", tag: "Embed", type: "iframe", src: "https://zty.pe/", bg: "linear-gradient(135deg, #000000 0%, #00ffff 100%)", icon: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h2M11 10h2M15 10h2M9 14h6"/>', stroke: "#00ff00" },
      { title: "0h h1", desc: "A logic puzzle of rules.", tag: "Embed", type: "iframe", src: "https://0hh1.com/", bg: "linear-gradient(135deg, #2c3e50 0%, #e74c3c 100%)", icon: '<rect x="3" y="3" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/>', stroke: "#ecf0f1" },
      { title: "0h n0", desc: "Logic puzzle of blue dots.", tag: "Embed", type: "iframe", src: "https://0hn0.com/", bg: "linear-gradient(135deg, #2c3e50 0%, #3498db 100%)", icon: '<circle cx="8" cy="8" r="4"/><circle cx="16" cy="16" r="4"/>', stroke: "#ecf0f1" },
      { title: "Cookie Clicker", desc: "The original idle game.", tag: "Embed", type: "iframe", src: "https://orteil.dashnet.org/cookieclicker/", bg: "linear-gradient(135deg, #2c1e14 0%, #6b4e34 100%)", icon: '<circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1.5"/><circle cx="15" cy="11" r="1.5"/><circle cx="11" cy="15" r="1.5"/>', stroke: "#d4a36f" },
      { title: "Little Alchemy", desc: "Combine elements to make new ones.", tag: "Embed", type: "iframe", src: "https://littlealchemy.com/", bg: "linear-gradient(135deg, #f4a460 0%, #d2691e 100%)", icon: '<circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 2"/>', stroke: "#ffffff" },
      { title: "Entanglement", desc: "Create the longest path possible.", tag: "Embed", type: "iframe", src: "https://playentanglement.com/", bg: "linear-gradient(135deg, #2c3e50 0%, #16a085 100%)", icon: '<path d="M4 4l16 16M20 4L4 20M4 12h16M12 4v16"/>', stroke: "#ecf0f1" },
      { title: "HexGL", desc: "A futuristic WebGL racing game.", tag: "Embed", type: "iframe", src: "https://hexgl.bkcore.com/play/", bg: "linear-gradient(135deg, #0d0d0d 0%, #2c3e50 100%)", icon: '<path d="M12 2l9 16H3z"/>', stroke: "#e74c3c" },
      { title: "Sudoku", desc: "Fill the 9x9 grid with numbers.", tag: "Embed", type: "iframe", src: "https://unixpapa.com/sudoku/", bg: "linear-gradient(135deg, #ffffff 0%, #cccccc 100%)", icon: '<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>', stroke: "#333333" },

      // --- CUSTOM CODED GAMES (from scratch) ---
      { title: "Snake", desc: "Eat apples, grow longer.", tag: "Custom", type: "custom", g: "gSnake", bg: "radial-gradient(circle at center, rgba(44, 90, 148, 0.8), transparent)", icon: '<path d="M3 12h4l2 6 4-12 2 6h6"/>', stroke: "#A9B7D1" },
      { title: "Connect 4", desc: "Get four in a row vs AI.", tag: "Custom", type: "custom", g: "gC4", bg: "linear-gradient(135deg, #3498db 0%, #e74c3c 100%)", icon: '<circle cx="8" cy="8" r="3"/><circle cx="16" cy="16" r="3"/>', stroke: "#ffffff" },
      { title: "Tic-Tac-Toe", desc: "Beat a smart AI opponent.", tag: "Custom", type: "custom", g: "gTTT", bg: "radial-gradient(circle at center, rgba(150, 190, 255, 0.3), transparent)", icon: '<line x1="8" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="16" y2="21"/><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="16" x2="21" y2="16"/>', stroke: "#E3B873" },
      { title: "Memory Match", desc: "Find matching pairs.", tag: "Custom", type: "custom", g: "gMemory", bg: "radial-gradient(circle at center, rgba(227, 184, 115, 0.4), transparent)", icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/>', stroke: "#E3B873" },
      { title: "Simon Says", desc: "Repeat the color sequence.", tag: "Custom", type: "custom", g: "gSimon", bg: "radial-gradient(circle at center, rgba(155, 89, 182, 0.5), transparent)", icon: '<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 2"/>', stroke: "#f1c40f" },
      { title: "Whack-a-Mole", desc: "Hit the moles before they hide.", tag: "Custom", type: "custom", g: "gWhack", bg: "radial-gradient(circle at center, rgba(139, 69, 19, 0.6), transparent)", icon: '<circle cx="12" cy="12" r="8"/><circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/>', stroke: "#E3B873" },
      { title: "Reaction Test", desc: "Click when green.", tag: "Custom", type: "custom", g: "gReact", bg: "radial-gradient(circle at center, rgba(231, 76, 60, 0.6), transparent)", icon: '<circle cx="12" cy="12" r="9"/><polygon points="10 8 16 12 10 16" fill="currentColor"/>', stroke: "#E3B873" },
      { title: "Word Scramble", desc: "Unscramble the words.", tag: "Custom", type: "custom", g: "gWord", bg: "linear-gradient(135deg, #34495e 0%, #2ecc71 100%)", icon: '<path d="M4 4h16v12H4z"/><path d="M8 8h8M8 12h5"/>', stroke: "#ecf0f1" },
      { title: "Hangman", desc: "Guess the word letter by letter.", tag: "Custom", type: "custom", g: "gHangman", bg: "linear-gradient(135deg, #2c3e50 0%, #34495e 100%)", icon: '<path d="M4 20V4h8M12 4v4h4"/>', stroke: "#ecf0f1" },
      { title: "Rock Paper Scissors", desc: "Classic hand game vs AI.", tag: "Custom", type: "custom", g: "gRPS", bg: "radial-gradient(circle at center, rgba(155, 89, 182, 0.5), transparent)", icon: '<path d="M14 2v6h4l-7 14v-9H7l7-11z"/>', stroke: "#F3F5F9" }
    ];

    // Render Grid
    const grid = document.getElementById('gamesGrid');
    games.forEach((g, i) => {
      grid.innerHTML += `<div class="game-card" data-type="${g.type}" data-src="${g.src||''}" data-g="${g.g||''}" data-title="${g.title}"><div class="game-thumb" style="background:${g.bg};"><svg viewBox="0 0 24 24" fill="none" stroke="${g.stroke}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${g.icon}</svg><div class="play-overlay"><div class="play-icon"></div></div></div><div class="game-info"><div class="game-title">${g.title}</div><div class="game-desc">${g.desc}</div><div class="game-tag">${g.tag}</div></div></div>`;
    });

    document.querySelectorAll('.game-card').forEach((card) => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mx', `${e.clientX - rect.left}px`);
        card.style.setProperty('--my', `${e.clientY - rect.top}px`);
      });
    });

    // Modal Logic
    const modal = document.getElementById('gameModal');
    const closeModal = document.getElementById('closeModal');
    const gameContainer = document.getElementById('gameContainer');
    const modalTitle = document.getElementById('modalTitle');
    let activeGame = null, intervals = [], rafs = [], keyListeners = [];

    function openModal(card) {
      gameContainer.innerHTML = '';
      modalTitle.innerText = card.dataset.title;
      modal.classList.add('active');
      const type = card.dataset.type;
      const g = card.dataset.g;
      
      if (type === 'iframe') {
        gameContainer.innerHTML = `<iframe src="${card.dataset.src}" class="game-iframe" allow="autoplay; fullscreen; gamepad"></iframe>`;
        activeGame = 'iframe';
      } else {
        if (g === "gSnake") initSnake();
        else if (g === "gC4") initC4();
        else if (g === "gTTT") initTTT();
        else if (g === "gMemory") initMemory();
        else if (g === "gSimon") initSimon();
        else if (g === "gWhack") initWhack();
        else if (g === "gReact") initReaction();
        else if (g === "gWord") initWordScramble();
        else if (g === "gHangman") initHangman();
        else if (g === "gRPS") initRPS();
        activeGame = g;
      }
    }

    closeModal.addEventListener('click', () => {
      modal.classList.remove('active');
      intervals.forEach(clearInterval); intervals = [];
      rafs.forEach(cancelAnimationFrame); rafs = [];
      keyListeners.forEach(l => document.removeEventListener('keydown', l)); keyListeners = [];
      gameContainer.innerHTML = ''; // destroys iframe to stop audio/processing
      activeGame = null;
    });

    document.querySelectorAll('.game-card').forEach(card => card.addEventListener('click', () => openModal(card)));

    function addKeyListener(fn) { keyListeners.push(fn); document.addEventListener('keydown', fn); }

    // --- CUSTOM GAME LOGICS ---

    // Snake
    function initSnake() {
      gameContainer.innerHTML = `<div class="game-score">Score: <span id="sSnake">0</span></div><canvas id="cSnake" width="300" height="300"></canvas>`;
      const c = document.getElementById('cSnake'), x = c.getContext('2d'), s = 15; let sn=[{x:150,y:150}], dx=s, dy=0, f={x:60,y:60}, sc=0;
      function pf() { f={x:Math.floor(Math.random()*20)*s, y:Math.floor(Math.random()*20)*s}; }
      function d() {
        x.fillStyle='rgba(11,27,58,0.3)'; x.fillRect(0,0,c.width,c.height);
        x.fillStyle='#E3B873'; x.fillRect(f.x,f.y,s-1,s-1);
        x.fillStyle='#A9B7D1'; sn.forEach(p=>x.fillRect(p.x,p.y,s-1,s-1));
        let h={x:sn[0].x+dx, y:sn[0].y+dy};
        if(h.x<0||h.x>=c.width||h.y<0||h.y>=c.height||sn.some(p=>p.x===h.x&&p.y===h.y)){ clearInterval(intervals.pop()); x.fillStyle="#E3B873"; x.font="20px sans"; x.textAlign="center"; x.fillText("Game Over!",150,150); return; }
        sn.unshift(h);
        if(h.x===f.x&&h.y===f.y){ sc++; document.getElementById('sSnake').innerText=sc; pf(); } else sn.pop();
      }
      addKeyListener(e => { if(e.key==='ArrowUp'&&dy===0){dx=0;dy=-s;} else if(e.key==='ArrowDown'&&dy===0){dx=0;dy=s;} else if(e.key==='ArrowLeft'&&dx===0){dx=-s;dy=0;} else if(e.key==='ArrowRight'&&dx===0){dx=s;dy=0;} });
      pf(); intervals.push(setInterval(d, 100));
    }

    // Connect 4
    function initC4() {
      gameContainer.innerHTML = `<div class="game-score" id="cStat">Your Turn (Red)</div><div class="grid-board" id="bC4" style="grid-template-columns: repeat(7, 36px);"></div>`;
      const b=document.getElementById('bC4'); let bd=Array(42).fill(null);
      b.innerHTML=Array(42).fill(0).map((c,i)=>`<div class="cell" data-i="${i}" style="width:32px;height:32px;border-radius:50%;"></div>`).join('');
      b.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{ let col=(+c.dataset.i)%7; for(let r=5;r>=0;r--){ let idx=r*7+col; if(!bd[idx]){ bd[idx]='R'; b.children[idx].style.background='#e74c3c'; if(win('R')){document.getElementById('cStat').innerText="You Win!";return;} setTimeout(()=>{ let cm=[0,1,2,3,4,5,6].sort(()=>Math.random()-0.5).find(c=>bd[c]===null); for(let r2=5;r2>=0;r2--){ let idx2=r2*7+cm; if(!bd[idx2]){ bd[idx2]='Y'; b.children[idx2].style.background='#f1c40f'; document.getElementById('cStat').innerText=win('Y')?"Comp Wins!":"Your Turn (Red)"; break; } } },500); break; } } });
      let win=(p)=>{ for(let r=0;r<6;r++)for(let c=0;c<7;c++){ let i=r*7+c; if(bd[i]===p&&bd[i+1]===p&&bd[i+2]===p&&bd[i+3]===p&&c<4)return true; if(bd[i]===p&&bd[i+7]===p&&bd[i+14]===p&&bd[i+21]===p&&r<3)return true; if(bd[i]===p&&bd[i+8]===p&&bd[i+16]===p&&bd[i+24]===p&&r<3&&c<4)return true; if(bd[i]===p&&bd[i+6]===p&&bd[i+12]===p&&bd[i+18]===p&&r<3&&c>2)return true; } return false; };
    }

    // Tic-Tac-Toe
    function initTTT() {
      gameContainer.innerHTML = `<div class="game-score" id="tStat">Your Turn (X)</div><div class="grid-board" id="bTTT" style="grid-template-columns: repeat(3, 80px);"></div>`;
      const b=document.getElementById('bTTT'); let bd=Array(9).fill(null);
      b.innerHTML=Array(9).fill(0).map((c,i)=>`<div class="cell" data-i="${i}" style="width:75px;height:75px;font-size:30px;"></div>`).join('');
      b.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{ let i=+c.dataset.i; if(bd[i]||win('O'))return; bd[i]='X'; c.innerText='X'; if(win('X')){document.getElementById('tStat').innerText="You Win!";return;} if(bd.every(v=>v)){document.getElementById('tStat').innerText="Draw!";return;} document.getElementById('tStat').innerText="Computer..."; setTimeout(()=>{ let m=best('O')||best('X')||(bd[4]===null?4:null)||rnd(); if(m!==null){bd[m]='O'; b.children[m].innerText='O'; document.getElementById('tStat').innerText=win('O')?"Comp Wins!":"Your Turn (X)"; } },500); });
      let winCheck=(b,p)=>[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(w=>w.every(i=>b[i]===p));
      let win=(p)=>winCheck(bd,p); 
      let best=(p)=>{ for(let i=0;i<9;i++){ if(!bd[i]){ let t=[...bd]; t[i]=p; if(winCheck(t,p))return i; } } return null; };
      let rnd=()=>{ let e=bd.map((v,i)=>v===null?i:null).filter(v=>v!==null); return e.length?e[Math.floor(Math.random()*e.length)]:null; };
    }

    // Memory
    function initMemory() {
      const e=['🐒','🎮','🚀','🤖','🎧','💾','📸','⚡']; let cs=[...e,...e].sort(()=>Math.random()-0.5);
      gameContainer.innerHTML=`<div class="game-score">Matches: <span id="mScore">0</span> / 8</div><div class="grid-board" id="bMem" style="grid-template-columns: repeat(4, 70px);"></div>`;
      const b=document.getElementById('bMem'); let f=[], m=0, l=false;
      b.innerHTML=cs.map((e,i)=>`<div class="cell" data-e="${e}" data-i="${i}" style="width:66px;height:66px;font-size:30px;">?</div>`).join('');
      b.querySelectorAll('.cell').forEach(c=>c.onclick=()=>{ if(l||c.classList.contains('flipped')||c.classList.contains('matched'))return; c.innerText=c.dataset.e; c.classList.add('flipped'); f.push(c); if(f.length===2){ l=true; if(f[0].dataset.e===f[1].dataset.e){ f[0].classList.add('matched'); f[1].classList.add('matched'); m++; document.getElementById('mScore').innerText=m; f=[]; l=false; if(m===8)setTimeout(()=>alert("Win!"),300); } else { setTimeout(()=>{ f.forEach(x=>{x.innerText='?';x.classList.remove('flipped');}); f=[]; l=false; },800); } } });
    }

    // Simon
    function initSimon() {
      gameContainer.innerHTML=`<div class="game-score">Level: <span id="simL">0</span> (Watch closely)</div><div id="bSimon" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;width:240px;height:240px;"></div>`;
      const b=document.getElementById('bSimon'); let seq=[], uSeq=[], l=0;
      const cols=[{c:'#e74c3c',s:1},{c:'#f1c40f',s:2},{c:'#2ecc71',s:3},{c:'#3498db',s:4}];
      b.innerHTML=cols.map(o=>`<div data-s="${o.s}" style="background:${o.c};opacity:0.3;border-radius:12px;cursor:pointer;"></div>`).join('');
      b.querySelectorAll('div').forEach(d=>d.onclick=()=>{ if(seq.length===0)return; d.style.opacity=1; setTimeout(()=>d.style.opacity=0.3,200); uSeq.push(+d.dataset.s); if(uSeq[uSeq.length-1]!==seq[uSeq.length-1]){ seq=[]; l=0; document.getElementById('simL').innerText=0; alert("Wrong!"); return; } if(uSeq.length===seq.length){ l++; document.getElementById('simL').innerText=l; uSeq=[]; setTimeout(next,1000); } });
      function next(){ seq.push(Math.floor(Math.random()*4)+1); let i=0; function p(){ let el=b.children[seq[i]-1]; el.style.opacity=1; setTimeout(()=>{ el.style.opacity=0.3; i++; if(i<seq.length)setTimeout(p,500); },400); } p(); }
      next();
    }

    // Whack-a-Mole
    function initWhack() {
      gameContainer.innerHTML=`<div class="game-score">Time: <span id="wT">30</span> | Score: <span id="wS">0</span></div><div id="bWhack" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:280px;"></div>`;
      let s=0,t=30,a=-1; const b=document.getElementById('bWhack');
      b.innerHTML=Array(9).fill('<div style="width:80px;height:80px;background:rgba(0,0,0,0.3);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;"></div>').join('');
      function pop(){ if(a>=0) b.children[a].innerHTML=''; a=Math.floor(Math.random()*9); b.children[a].innerHTML='🐒'; }
      b.querySelectorAll('div').forEach((h,i)=>h.onclick=()=>{ if(i===a){ s++; document.getElementById('wS').innerText=s; h.innerHTML='💥'; a=-1; } });
      intervals.push(setInterval(()=>{ t--; document.getElementById('wT').innerText=t; if(t<=0){ clearInterval(intervals.pop()); clearInterval(intervals.pop()); alert("Time! Score: "+s); } },1000));
      intervals.push(setInterval(pop,800)); pop();
    }

    // Reaction Test
    function initReaction() {
      gameContainer.innerHTML=`<div class="game-score">Reaction Time Test</div><div id="rBox" style="width:300px;height:300px;background:#e74c3c;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;font-size:20px;color:white;text-align:center;padding:20px;">Click to Start</div>`;
      let b=document.getElementById('rBox'), st, to;
      b.onclick=()=>{ if(b.style.backgroundColor==='rgb(231, 76, 60)'){ b.style.background='#2c3e50'; b.innerText='Wait for Green...'; to=setTimeout(()=>{ b.style.background='#2ecc71'; b.innerText='CLICK NOW!'; st=Date.now(); },Math.random()*3000+1000); } else if(b.style.backgroundColor==='rgb(46, 204, 113)'){ b.style.background='#e74c3c'; b.innerText=`${Date.now()-st}ms! Click to retry.`; } else { clearTimeout(to); b.style.background='#e74c3c'; b.innerText='Too soon! Click to retry.'; } };
    }

    // Word Scramble
    function initWordScramble() {
      const w=['javascript','arcade','brodes','gaming','website','code','monkey','liquid','glass','retro']; let ans=w[Math.floor(Math.random()*w.length)];
      let sc=ans.split('').sort(()=>Math.random()-0.5).join('');
      if(sc===ans)sc=ans.split('').reverse().join('');
      gameContainer.innerHTML=`<div class="game-score">Unscramble: <span id="wScramble" style="font-size:20px;letter-spacing:4px;text-transform:uppercase;">${sc}</span></div><input type="text" id="wInput" style="padding:10px;font-size:16px;border-radius:8px;background:rgba(255,255,255,0.1);border:1px solid var(--border);color:var(--ink);margin:10px;" autofocus><button class="btn" id="wBtn">Submit</button><div id="wMsg" style="margin-top:10px;font-size:18px;font-weight:bold;"></div>`;
      document.getElementById('wBtn').onclick=()=>{ if(document.getElementById('wInput').value.toLowerCase()===ans){ document.getElementById('wMsg').innerText='Correct! 🎉'; document.getElementById('wMsg').style.color='#2ecc71'; } else { document.getElementById('wMsg').innerText='Try Again!'; document.getElementById('wMsg').style.color='#e74c3c'; } };
    }

    // Hangman
    function initHangman() {
      const w=['javascript','arcade','brodes','gaming','website','code','monkey','liquid','glass','retro']; let ans=w[Math.floor(Math.random()*w.length)], g=6, guess=[];
      gameContainer.innerHTML=`<div class="game-score">Lives: <span id="hL">6</span></div><div id="hWord" style="font-size:30px;letter-spacing:8px;margin-bottom:20px;"></div><div id="hAlpha" style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:300px;"></div>`;
      let a="abcdefghijklmnopqrstuvwxyz".split('');
      document.getElementById('hAlpha').innerHTML=a.map(l=>`<button class="btn-ghost" data-l="${l}">${l}</button>`).join('');
      function draw(){ document.getElementById('hWord').innerText=ans.split('').map(l=>guess.includes(l)?l:'_').join(' '); document.getElementById('hL').innerText=g; }
      document.querySelectorAll('#hAlpha button').forEach(b=>b.onclick=()=>{ let l=b.dataset.l; b.disabled=true; b.style.opacity=0.3; if(ans.includes(l)){ guess.push(l); draw(); if(ans.split('').every(c=>guess.includes(c))){ document.getElementById('hWord').innerText="WIN! 🎉"; document.querySelectorAll('#hAlpha button').forEach(x=>x.disabled=true); } } else { g--; draw(); if(g===0){ document.getElementById('hWord').innerText="LOSE: "+ans; document.querySelectorAll('#hAlpha button').forEach(x=>x.disabled=true); } } });
      draw();
    }

    // Rock Paper Scissors
    function initRPS() {
      gameContainer.innerHTML=`<div class="game-score">Rock Paper Scissors</div><div style="font-size:40px;margin-bottom:20px;"><span id="rpsP">✊</span> vs <span id="rpsC">✊</span></div><div style="font-size:20px;margin-bottom:20px;" id="rpsR">Choose your move!</div><div style="display:flex;gap:20px;font-size:40px;"><button class="rps-btn" data-m="✊" style="background:none;border:none;cursor:pointer;">✊</button><button class="rps-btn" data-m="✋" style="background:none;border:none;cursor:pointer;">✋</button><button class="rps-btn" data-m="✌️" style="background:none;border:none;cursor:pointer;">✌️</button></div>`;
      const m=['✊','✋','✌️'];
      document.querySelectorAll('.rps-btn').forEach(b=>b.onclick=()=>{ let p=b.dataset.m, c=m[Math.floor(Math.random()*3)]; document.getElementById('rpsP').innerText=p; document.getElementById('rpsC').innerText=c; if(p===c)document.getElementById('rpsR').innerText="Draw!"; else if((p==='✊'&&c==='✌️')||(p==='✋'&&c==='✊')||(p==='✌️'&&c==='✋'))document.getElementById('rpsR').innerText="You Win!"; else document.getElementById('rpsR').innerText="Computer Wins!"; });
    }
  </script>
