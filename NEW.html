<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brodes</title>
<style>
  :root {
    --bg-1: #0B1B3A;
    --bg-2: #1B3B6E;
    --bg-3: #2C5A94;
    --panel: rgba(255, 255, 255, 0.07);
    --ink: #F3F5F9;
    --ink-soft: #A9B7D1;
    --accent: #E3B873;
    --border: rgba(255, 255, 255, 0.2);
    --photo-size: 220px;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }
 
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  body {
    /* Base color to ensure the screen is always filled */
    background: var(--bg-1);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 24px;
    position: relative;
    overflow: hidden; /* Contains the massive twirling blobs */
  }

  /* --- TWIRLING LIQUID BLOBS --- */
  .blob {
    position: fixed;
    z-index: -1;
    width: 120vmax;
    height: 120vmax;
    top: -30vmax;
    left: -30vmax;
    filter: blur(80px); /* Heavy blur creates the seamless fluid blend */
    pointer-events: none;
    opacity: 0.85;
  }

  .blob-1 {
    background: 
      radial-gradient(circle at 30% 40%, rgba(150, 190, 255, 0.5), transparent 50%),
      radial-gradient(circle at 70% 60%, rgba(44, 90, 148, 0.8), transparent 50%);
    animation: twirlRight 35s linear infinite, blobMorph1 20s ease-in-out infinite alternate;
  }

  .blob-2 {
    background: 
      radial-gradient(circle at 60% 30%, rgba(227, 184, 115, 0.35), transparent 50%),
      radial-gradient(circle at 40% 80%, rgba(27, 59, 110, 0.9), transparent 50%);
    animation: twirlLeft 45s linear infinite, blobMorph2 25s ease-in-out infinite alternate;
  }

  @keyframes twirlRight {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes twirlLeft {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(-360deg); }
  }

  /* Organic shape shifting to make it feel like liquid */
  @keyframes blobMorph1 {
    0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
    50% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    100% { border-radius: 50% 50% 40% 60% / 40% 60% 50% 50%; }
  }

  @keyframes blobMorph2 {
    0% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
    50% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; }
    100% { border-radius: 50% 50% 60% 40% / 60% 40% 60% 40%; }
  }
 
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 760px;
    width: 100%;
    display: grid;
    grid-template-columns: var(--photo-size) 1fr;
    gap: 56px;
    align-items: start;
    opacity: 0;
    transform: translateY(12px);
    animation: rise 0.7s ease forwards 0.1s;
  }
 
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
 
  @media (prefers-reduced-motion: reduce) {
    .wrap { animation: none; opacity: 1; transform: none; }
    .blob { animation: none !important; border-radius: 50% !important; opacity: 0.5; }
    * { transition: none !important; }
  }
 
  .frame { position: relative; width: var(--photo-size); height: var(--photo-size); }
 
  .corner { position: absolute; width: 14px; height: 14px; border: 1.5px solid var(--accent); z-index: 2; }
  .corner.tl { top: -7px; left: -7px; border-right: none; border-bottom: none; }
  .corner.tr { top: -7px; right: -7px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: -7px; left: -7px; border-right: none; border-top: none; }
  .corner.br { bottom: -7px; right: -7px; border-left: none; border-top: none; }
 
  .photo-mount {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .photo-mount img { 
    width: 100%; 
    height: 100%; 
    object-fit: contain; 
    display: block; 
    opacity: 1; 
    filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.6));
    transition: transform 0.3s ease;
  }

  .photo-mount:hover img {
    transform: scale(1.05);
  }
 
  .caption {
    margin-top: 12px; font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.08em; color: var(--ink-soft); text-transform: uppercase; text-align: center;
  }
 
  .eyebrow {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
  }
 
  h1 {
    font-family: var(--font-sans);
    font-weight: 800;
    font-size: clamp(40px, 7vw, 64px);
    line-height: 1;
    letter-spacing: -0.015em;
    margin-bottom: 18px;
    border-radius: 4px;
  }
 
  .tagline {
    font-size: 17px; color: var(--ink-soft); margin-bottom: 20px;
    display: inline-block; border-bottom: 1px dashed var(--border); padding-bottom: 2px;
    border-radius: 4px;
  }
 
  .bio {
    font-size: 15.5px; line-height: 1.7; color: var(--ink);
    max-width: 46ch; margin-bottom: 30px; border-radius: 4px;
  }
 
  .find-me {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 12px;
  }
 
  /* --- SEAMLESS LIQUID GLASS TAB BAR --- */
  .tab-bar {
    position: relative;
    display: inline-flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow:
      0 12px 30px -14px rgba(0, 0, 0, 0.55),
      inset 0 1px 1px rgba(255, 255, 255, 0.4),
      inset 0 -1px 1px rgba(0, 0, 0, 0.2);
    overflow: hidden; 
    isolation: isolate;
  }

  .tab-bar::before {
    content: "";
    position: absolute;
    inset: -50%; 
    z-index: 0;
    background: radial-gradient(120px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.4), transparent 45%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    filter: blur(12px);
  }

  .tab-bar:hover::before {
    opacity: 1;
  }
 
  .tab {
    position: relative;
    z-index: 1; 
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 0.3s ease, background 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  
  .tab svg { 
    width: 15px; 
    height: 15px; 
    flex-shrink: 0; 
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); 
  }

  .tab:hover, .tab:focus-visible { 
    color: var(--ink); 
    background: rgba(255, 255, 255, 0.12);
    box-shadow:
      0 2px 8px -2px rgba(0, 0, 0, 0.3),
      inset 0 1px 1px rgba(255, 255, 255, 0.6), 
      inset 0 -1px 2px rgba(0, 0, 0, 0.1);
  }

  .tab:hover svg, .tab:focus-visible svg {
    transform: translateY(-1px) scale(1.05);
  }

  .tab:focus-visible { 
    outline: none; 
  }
 
  @media (max-width: 620px) {
    .wrap { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 28px; }
    .bio { max-width: 100%; }
    .tab-bar { justify-content: center; }
  }
</style>
</head>
<body>
  <!-- The twirling liquid background layers -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="wrap">
    <div>
      <div class="frame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="photo-mount">
          <!-- Changed to local profile.png so it works permanently on GitHub -->
          <img src="profile.png" alt="A cute cartoon monkey wearing a light blue knitted hat, with a blue and white face.">
        </div>
      </div>
      <div class="caption">Fig. 01 — Brodes</div>
    </div>
 
    <div>
      <div class="eyebrow">Hello, I'm</div>
      <h1>Brodes</h1>
      <div class="tagline">Tech Nerd Social Media Guy</div>
      <p class="bio">Hi I'm Brody/Brodes! I play lots of games and enjoy playing on my VR headset in my free time.</p>
      <div class="find-me">Find me</div>
      <div class="tab-bar" id="tabBar">
        <a class="tab" href="https://github.com/Br0des" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6l-5 6 5 6"/><path d="M16 6l5 6-5 6"/></svg>
          GitHub
        </a>
        <a class="tab" href="https://www.youtube.com/@BR0DES-1" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M10 9.5l5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>
          YouTube
        </a>
        <a class="tab" href="https://www.tiktok.com/@brodesvr" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
          TikTok
        </a>
        <a class="tab" href="games.html">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="10" rx="5"/><path d="M7 11v4M5 13h4"/><circle cx="16" cy="11.5" r="1"/><circle cx="18.5" cy="14" r="1"/></svg>
          Games
        </a>
      </div>
    </div>
  </div>
 
  <script>
    const tabBar = document.getElementById('tabBar');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    
    if (!reduceMotion) {
      // Track mouse across the ENTIRE tab bar for a seamless fluid effect
      tabBar.addEventListener('mousemove', (e) => {
        const rect = tabBar.getBoundingClientRect();
        tabBar.style.setProperty('--mx', `${e.clientX - rect.left}px`);
        tabBar.style.setProperty('--my', `${e.clientY - rect.top}px`);
      });
    }
  </script>
</body>
</html>
